name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: TypeScript com npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Executar build
        run: npm run build
